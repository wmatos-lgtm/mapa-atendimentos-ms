<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mapa de Atendimentos - MS</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      background: #ffffff;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbyc0Ox3ZOdr9eAOdprA281vTDyZS7BnxCtPuLcvPvxhNKqTVKZCg43JXS_68Ha9WnL8/exec';

const map = L.map('map', {
  zoomControl: true,
  attributionControl: false
});

function getFillColor(valor, maximo) {
  if (valor === 0) return '#eeeeee';

  const proporcao = maximo > 0 ? valor / maximo : 0;

  if (proporcao > 0.75) return '#54278f';
  if (proporcao > 0.50) return '#756bb1';
  if (proporcao > 0.25) return '#9e9ac8';
  if (proporcao > 0.10) return '#cbc9e2';

  return '#f2f0f7';
}

fetch(API_URL)
  .then(response => response.json())
  .then(resultado => {

    const geojson = resultado.geojson;
    const dados = resultado.dados;

    const valores = Object.values(dados)
      .map(d => Number(d.atendimentos) || 0);

    const maximo = Math.max(...valores, 1);

    const camada = L.geoJSON(geojson, {

      style: function(feature) {

        const codigo = String(feature.properties.CD_MUN).trim();
        const registro = dados[codigo];
        const atendimentos = registro ? registro.atendimentos : 0;

        return {
          fillColor: getFillColor(atendimentos, maximo),
          weight: 1,
          color: '#666',
          fillOpacity: 0.85
        };
      },

      onEachFeature: function(feature, layer) {

        const codigo = String(feature.properties.CD_MUN).trim();
        const registro = dados[codigo];

        const municipio =
          registro?.municipio ||
          feature.properties.NM_MUN ||
          'Município';

        const regiao = registro?.regiao || '';
        const atendimentos = registro?.atendimentos || 0;

        layer.bindTooltip(
          `<strong>${municipio}</strong><br>
           Região: ${regiao}<br>
           Atendimentos: ${atendimentos}`,
          { sticky: true }
        );
      }

    }).addTo(map);

    map.fitBounds(camada.getBounds(), {
      padding: [10, 10]
    });

  })
  .catch(error => {
    document.body.innerHTML =
      '<p>Erro ao carregar os dados: ' +
      error.message +
      '</p>';
  });

</script>

</body>
</html>
